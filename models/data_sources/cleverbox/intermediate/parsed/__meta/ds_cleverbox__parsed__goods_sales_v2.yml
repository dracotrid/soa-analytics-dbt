version: 2

models:
  - name: ds_cleverbox__parsed__goods_sales_v2
    description: "CleverBox Parsed Goods Sales v2"
    config:
      alias: parsed__goods_sales_v2
      meta:
        tf_config:
          filter: field_0 IS NOT NULL AND field_0 NOT IN ('NO DATA', 'Total:', 'Разом')
          op: schema_version
          schema_version: 2
    columns:
      - name: date
        data_type: DATE
        description: Goods date of sale
        meta:
          tf_config:
            expression: PARSE_DATE('%d.%m.%Y', REGEXP_EXTRACT(field_0, r'\d{2}\.\d{2}\.\d{4}'))
      - name: branch
        data_type: STRING
        description: Branch of goods sale
        meta:
          tf_config:
            field: field_1
            required: false
      - name: receipt
        data_type: STRING
        description: Receipt
        meta:
          tf_config:
            field: field_0
      - name: expert_name
        data_type: STRING
        description: The employee who sold the goods
        meta:
          tf_config:
            field: field_3
      - name: client_code
        data_type: STRING
        description: Client code
        meta:
          tf_config:
            field: field_4
      - name: client_name
        data_type: STRING
        description: Client name
        meta:
          tf_config:
            field: field_5
      - name: goods_code
        data_type: STRING
        logic_type: STRING.CODE
        description: Goods code
        meta:
          tf_config:
            field: field_7
      - name: goods_name
        data_type: STRING
        description: Goods name
        meta:
          tf_config:
            field: field_8
      - name: brand
        data_type: STRING
        description: Brand of goods
        meta:
          tf_config:
            expression: COALESCE(field_9, 'UNKNOWN_BRAND')
      - name: amount
        data_type: NUMERIC.AMOUNT
        description: Amount of goods sold
        meta:
          tf_config:
            expression: REPLACE(field_12, ',', '')
      - name: price
        data_type: NUMERIC.PRICE
        description: Price of goods
        meta:
          tf_config:
            expression: REPLACE(COALESCE(field_13, '0'), ',', '')
      - name: cost_price_unit
        data_type: NUMERIC.PRICE
        description: Cost price of one goods
        meta:
          tf_config:
            expression: REPLACE(COALESCE(field_14, '0'), ',', '')
      - name: paid
        data_type: NUMERIC.COST
        description: Total cost of goods
        meta:
          tf_config:
            expression: REPLACE(field_15, ',', '')
